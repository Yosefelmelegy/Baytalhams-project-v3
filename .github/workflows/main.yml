name: Build EXE and APK (32-bit + 64-bit)

on:
  workflow_dispatch:        # زرار "Run workflow" يدوي
  push:
    branches: [main, master]

jobs:
  # ---------------------------------------------------------------- ويندوز: 64 بت و32 بت
  windows-exe:
    name: Windows EXE (${{ matrix.bits }}-bit)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - bits: 64
            arch: x64
          - bits: 32
            arch: x86
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.arch }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name BaytAlHams_${{ matrix.bits }}bit --icon assets/icon.ico --add-data "assets;assets" --hidden-import pyttsx3.drivers --hidden-import pyttsx3.drivers.sapi5 --hidden-import server main.py
      - uses: actions/upload-artifact@v4
        with:
          name: BaytAlHams-EXE-${{ matrix.bits }}bit
          path: dist/BaytAlHams_${{ matrix.bits }}bit.exe

  # ---------------------------------------------------------------- أندرويد: arm64 (64 بت) وarmv7 (32 بت)
  android-apk:
    name: Android APK (${{ matrix.bits }}-bit)
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - bits: 64
            abi: arm64-v8a
          - bits: 32
            abi: armeabi-v7a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends autoconf automake build-essential ccache cmake gettext git libffi-dev libltdl-dev libncurses5-dev libncursesw5-dev libssl-dev libtinfo5 libtool patch pkg-config unzip zip zlib1g-dev
      - name: Buildozer
        run: pip install --upgrade buildozer "Cython<0.30" virtualenv pip appdirs packaging colorama jinja2 toml build
      - name: Set target architecture (${{ matrix.abi }})
        run: sed -i "s/^android.archs *=.*/android.archs = ${{ matrix.abi }}/" buildozer.spec
      - name: Build APK
        run: buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: BaytAlHams-APK-${{ matrix.bits }}bit
          path: bin/*.apk


name: Build Bayt Al Hams

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build Windows ${{ matrix.arch }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            python: "3.11"
          - arch: x64
            python: "3.11"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name BaytAlHams --icon assets/icon.ico --add-data "assets;assets" --hidden-import pyttsx3.drivers --hidden-import pyttsx3.drivers.sapi5 --hidden-import server main.py

      - name: Rename EXE
        run: |
          Rename-Item dist/BaytAlHams.exe BaytAlHams-${{ matrix.arch }}.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: BaytAlHams-Windows-${{ matrix.arch }}
          path: dist/BaytAlHams-${{ matrix.arch }}.exe
          if-no-files-found: error
